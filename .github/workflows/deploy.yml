name: Deploy Pikvero to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          # The application URLs and asset paths use the /pikvero/ subdirectory.
          server-dir: /htdocs/pikvero/
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/scratch/**
            **/assets/images/uploads/logo_test_demo.png
            **/*firebase-adminsdk*.json
            **/storage/logs/**
            **/*.log
            **/database/schema.sql
            **/database/setup.php
            **/database/seed_*.php
            **/*.local.php
            **/loop.md
            **/prompt*.md
            **/README.md
